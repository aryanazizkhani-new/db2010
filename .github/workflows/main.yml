
name: DB2010 Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout DB2010
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Checkout QEMU only
        shell: pwsh
        run: |
          git submodule update --init -- qemu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check environment
        run: |
          python --version
          git --version
          cmake --version

      - name: Verify DB2010 and QEMU
        shell: pwsh
        run: |
          if (!(Test-Path "pyproject.toml")) {
            throw "DB2010 source is missing"
          }

          if (!(Test-Path "qemu/configure")) {
            throw "QEMU source is incomplete"
          }

          $expected = "60db24c5ce984972a8d57a17ba61edafd08e09a2"
          $actual = (git -C qemu rev-parse HEAD).Trim()

          Write-Host "QEMU commit: $actual"

          if ($actual -ne $expected) {
            throw "QEMU commit does not match the required version"
          }

          Write-Host "DB2010 and QEMU source verification passed."
