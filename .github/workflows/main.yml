
name: DB2010 Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Enable Git long paths
        run: |
          git config --global core.longpaths true

      - name: Checkout DB2010
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python --version
          git --version
          cmake --version

      - name: Verify QEMU source
        shell: pwsh
        run: |
          Write-Host "Checking DB2010 source..."

          if (!(Test-Path "pyproject.toml")) {
            throw "pyproject.toml not found"
          }

          if (!(Test-Path "qemu/configure")) {
            throw "QEMU source is missing or incomplete"
          }

          git -C qemu rev-parse HEAD
          git -C qemu status --short

          Write-Host "QEMU source check completed."
